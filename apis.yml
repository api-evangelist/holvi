name: Holvi
description: >-
  Holvi is a Finnish digital business-banking service for freelancers, founders and small
  businesses, founded in Helsinki in 2011 and operating as a regulated Authorised Payment
  Institution supervised by the Finnish Financial Supervisory Authority. It combines a
  business account with its own IBAN, a Holvi Business Mastercard, invoicing, expense
  tracking, VAT calculation and bookkeeping preparation in one dashboard, serving more than
  150,000 businesses across Europe with a focus on Finland, Germany and Austria. For
  developers, Holvi publishes a PSD2 API v2.0 for licensed Third Party Providers, exposing
  account information (AISP) and payment initiation (PISP, SEPA / SEPA Instant / SWIFT) with
  Strong Customer Authentication and optional Verification of Payee.
